# Automated translations workflow (#5357)
# ----------------------------------------------------------------------
# Goal: let community translators submit translation-only PRs and have
# them merged without a maintainer release-cycle bottleneck.
#
# How it works:
#   1. Trigger on PRs that touch any `public/locales/*.json` file.
#   2. Detect whether the PR is "translations-only" (changed files set
#      is fully contained in public/locales/ AND doesn't touch en.json;
#      en is the master, so changes to it still need a normal review).
#   3. Run `scripts/validate-locales.js` against the changed files to
#      check JSON validity, _meta fields, shape compatibility with
#      en.json (no type mismatches that would break i18n lookup), and
#      that a translation has no markup the English text does not have.
#   4. If translations-only AND validation passes, label the PR
#      `translations-only` so it is easy to find. A person still reads
#      and merges it: nothing here merges a PR.
#
# Security: this workflow runs on `pull_request` (NOT pull_request_target),
# so PRs from forks cannot read repo secrets. Validation runs in a
# sandbox. We never execute translation JSON content.

name: Translations auto-validate

on:
  pull_request:
    paths:
      - 'public/locales/**'
      - 'scripts/validate-locales.js'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: List changed files
        id: changes
        run: |
          # Compare against the PR base, which works for both same-repo and fork PRs
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files:"
          echo "$changed"
          echo "$changed" > /tmp/changed.txt

          # Translations-only = every changed file is under public/locales/
          # AND none of them is en.json (the master).
          translations_only=true
          touches_en=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              public/locales/*.json) ;;
              *) translations_only=false ;;
            esac
            if [ "$f" = "public/locales/en.json" ]; then touches_en=true; fi
          done < /tmp/changed.txt

          if [ "$touches_en" = "true" ]; then translations_only=false; fi
          echo "translations_only=$translations_only" >> "$GITHUB_OUTPUT"

          # Build the list of locale files to validate (only non-en ones)
          locale_files=$(grep -E '^public/locales/.*\.json$' /tmp/changed.txt | grep -v '^public/locales/en\.json$' || true)
          echo "$locale_files" > /tmp/locale_files.txt
          # GitHub Actions multiline output
          {
            echo "locale_files<<EOF"
            cat /tmp/locale_files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate changed locale files
        id: validate
        if: steps.changes.outputs.locale_files != ''
        env:
          # File names come from the PR, so they arrive as data in an
          # environment variable and never get pasted into the script, where
          # a name like x$(cmd).json would run as a command.
          LOCALE_FILES: ${{ steps.changes.outputs.locale_files }}
        run: |
          # Pass each changed locale file to the validator as its own argument
          files=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            files+=("$f")
          done <<< "$LOCALE_FILES"
          echo "Validating: ${files[*]}"
          node scripts/validate-locales.js "${files[@]}"

      - name: Label translations-only PR
        if: steps.changes.outputs.translations_only == 'true' && success()
        # Best-effort: PRs from forks run with a read-only token, so adding
        # the label (or creating it) can fail. Validation above already
        # passed, so a labeling failure must not fail the whole job (#5716).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --add-label "translations-only" || true
          # The label may not exist yet, so create it then retry
          gh label create "translations-only" --color "0E8A16" --description "Touches only translation files" 2>/dev/null || true
          gh pr edit "${{ github.event.pull_request.number }}" \
            --add-label "translations-only" || true

      # No auto-merge. Translated text is put into the page as markup, so a
      # translation is read by a person before it goes in, like any other
      # change. The validator above refuses markup the English text does not
      # have; the label only says the PR touches nothing but locale files.
